name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core dependencies
        run: npm ci

      - name: Typecheck, build and test core
        run: npm run ci

      - name: Run deterministic QA in hardened container
        run: npm run check:sandbox

      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Typecheck dashboard
        working-directory: apps/dashboard
        run: npm run typecheck

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
